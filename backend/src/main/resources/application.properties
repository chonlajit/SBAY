spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=27017
spring.data.mongodb.database=iotdb
server.port=8070
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Email Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# API Key Security for IoT Devices
sbay.device.secret=${DEVICE_SECRET:default_secret_key_123}

# JWT Secret
sbay.jwt.secret=${JWT_SECRET:SmartBinSecureKeyForIoTBackend2024_MustBe32BytesLength}
# Concurrency & High Load Tuning for Tomcat
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=500
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000

# MongoDB Connection Pool Tuning
spring.data.mongodb.connection-pool.max-size=150
spring.data.mongodb.connection-pool.min-size=10
spring.data.mongodb.connection-pool.max-wait-time=5000

# Logging: Standard INFO level to prevent CPU/IO lockup under load
logging.level.org.springframework.web=INFO
logging.level.com.example.iotbackend=INFO

