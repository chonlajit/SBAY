# Rate Limit Zones (10MB can track ~160,000 distinct IP addresses)
# Tier 1 Perimeter Shield: Protects backend from flood & DoS attacks
limit_req_zone $binary_remote_addr zone=nginx_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nginx_device_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nginx_api_limit:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    client_max_body_size 50M;

    # Timeouts to prevent hanging connections
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. Authentication APIs (Strict Rate Limit: 10 req/min, burst 5)
    location /api/auth/ {
        limit_req zone=nginx_auth_limit burst=5 nodelay;
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. IoT Devices / Smart Bin (Rate Limit: 60 req/min, burst 20)
    location /api/devices/ {
        limit_req zone=nginx_device_limit burst=20 nodelay;
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/machine/ {
        limit_req zone=nginx_device_limit burst=20 nodelay;
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. General Backend API Route (Rate Limit: 120 req/min, burst 30)
    location /api/ {
        limit_req zone=nginx_api_limit burst=30 nodelay;
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Uploaded Files Route (with HTTP/1.1 and 7-day browser cache)
    location /uploads/ {
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 5. Native WebSocket Route (Keep-alive for 1 hour)
    location /ws-native {
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 6. Fallback WebSocket Route (Keep-alive for 1 hour)
    location /ws {
        proxy_pass http://host.docker.internal:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 7. Next.js Static Chunks (immutable 30-day cache)
    location /_next/static/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 8. Frontend Static Images (Landing Page & Backgrounds - direct from volume)
    location /images/ {
        alias /var/www/public/images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 9. Frontend Static Fonts (30-day cache & CORS - direct from volume)
    location /fonts/ {
        alias /var/www/public/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # 10. Root Static Assets
    location = /icon.svg {
        root /var/www/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        root /var/www/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 11. Frontend Next.js Route
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache on HTML to ensure browsers always request the latest Next.js build chunk hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
