# ==========================================================
# SBAY Nginx Configuration with Enterprise Anti-DDoS Shield
# Optimized for Ubuntu Production Server & Docker Architecture
# ==========================================================

# Real IP Extraction from Cloudflare Tunnel and Edge Proxies
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# 1. Anti-DDoS: Connection Limiting Zone (per real client IP)
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
limit_conn_status 429;

# 2. Anti-DDoS: Rate Limiting Zones (Leaky Bucket per real client IP)
# Global DDoS shield zone (absorbs high-frequency traffic bursts)
limit_req_zone $binary_remote_addr zone=nginx_ddos_protect:10m rate=30r/s;

# Per-API category rate limiting
limit_req_zone $binary_remote_addr zone=nginx_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nginx_device_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nginx_api_limit:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;

    # Anti-RCE Shield: Block React2Shell (CVE-2025-55182) & malicious Flight actions
    if ($http_next_action != "") {
        return 403;
    }

    # Anti-DDoS: Limit max concurrent connections per distinct client IP to 50
    limit_conn addr_conn 50;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Stable Keepalive for Cloudflare Tunnel persistent pooling
    keepalive_timeout 75s;
    keepalive_requests 10000;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Buffer sizes tuned to avoid Cloudflare 520 (large header / payload handling)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # 1. Authentication APIs (Strict Anti-Brute Force: 10 req/min, burst 5)
    location /api/auth/ {
        limit_req zone=nginx_ddos_protect burst=15 nodelay;
        limit_req zone=nginx_auth_limit burst=5 nodelay;

        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. IoT Devices / Smart Bin (Rate Limit: 60 req/min, burst 20)
    location /api/devices/ {
        limit_req zone=nginx_ddos_protect burst=30 nodelay;
        limit_req zone=nginx_device_limit burst=20 nodelay;

        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/machine/ {
        limit_req zone=nginx_ddos_protect burst=30 nodelay;
        limit_req zone=nginx_device_limit burst=20 nodelay;

        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. General Backend API Route (Rate Limit: 120 req/min, burst 30)
    location /api/ {
        limit_req zone=nginx_ddos_protect burst=40 nodelay;
        limit_req zone=nginx_api_limit burst=30 nodelay;

        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Uploaded Files Route (with HTTP/1.1 and 7-day browser cache)
    location /uploads/ {
        limit_req zone=nginx_ddos_protect burst=50 nodelay;

        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 5. Native WebSocket Route (Keep-alive for 1 hour)
    location /ws-native {
        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 6. Fallback WebSocket Route (Keep-alive for 1 hour)
    location /ws {
        proxy_pass http://backend:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 7. Next.js Static Chunks (immutable 30-day cache)
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 8. Frontend Static Images (Landing Page & Backgrounds - direct from volume)
    location /images/ {
        alias /var/www/public/images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 9. Frontend Static Fonts (30-day cache & CORS - direct from volume)
    location /fonts/ {
        alias /var/www/public/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # 10. Root Static Assets
    location = /icon.svg {
        root /var/www/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        root /var/www/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 11. Frontend Next.js Route (Protected by Anti-DDoS global shield)
    location / {
        limit_req zone=nginx_ddos_protect burst=50 nodelay;

        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache on HTML to ensure browsers always request the latest Next.js build chunk hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
