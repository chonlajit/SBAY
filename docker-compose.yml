services:
  mongodb:
    image: mongo:latest
    container_name: sbay-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbay-backend
    ports:
      - "8070:8070"
    environment:
      - MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/iotdb
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbay-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8070
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sbay-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  mongodb_data:
