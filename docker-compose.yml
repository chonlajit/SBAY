services:
  mongodb:
    image: mongo:latest
    container_name: sbay-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbay-backend
    ports:
      - "8070:8070"
    environment:
      - MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/iotdb
      - DEVICE_SECRET=${DEVICE_SECRET}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbay-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://143.14.36.198/apis
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sbay-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:${WINDOWS_IP}"
    restart: always

  mongo-express:
    image: mongo-express
    container_name: sbay-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongodb

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sbay-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  mongodb_data:
